# =============================================================================
# Tmux Configuration
# =============================================================================

# --- Terminal & shell ---
set -g default-terminal "tmux-direct"
set -as terminal-features ",xterm-ghostty:RGB"
set -g default-command fish

# --- General settings ---
set -g mouse on                    # Scroll, select, resize with mouse
set -g history-limit 100000        # Generous scrollback buffer
set -s set-clipboard on            # OSC 52 clipboard (Ghostty, kitty, etc.)
set -g renumber-windows on         # Renumber windows when one is closed
set -g allow-rename on             # Let applications set window name via escape sequences
set -g set-titles on               # Pass title through to outer terminal
set -g automatic-rename on         # Auto-rename windows
set -g automatic-rename-format '#{pane_title}'  # Use pane title (set by pi, etc.)
set -g extended-keys on            # Modified keys (e.g. Enter) work in apps
set -g base-index 1                # Start window numbering at 1
setw -g pane-base-index 1          # Start pane numbering at 1

# --- Custom keybindings ---

# Intuitive splits (| = vertical, - = horizontal), open in current path
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# prefix + a: Create a new named session (prompts for name)
bind-key a command-prompt -p "New session name:" { new-session -d -s "%%" ; switch-client -t "%%" }

# prefix + h: Toggle the hints bar on/off
bind-key h if -F '#{==:#{status},2}' 'set -g status on' 'set -g status 2'

# Scroll 1 line at a time instead of 3
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# =============================================================================
# Hints bar — Zellij-style shortcut reference (toggle: prefix + h)
# =============================================================================
#
# Colors come from @hint-session, @hint-window, @hint-pane (set by theme).
# Background & text inherit from status-style; badges use reverse video.
#
# SEPARATORS:
#   │  (box-drawing)    separates shortcuts within a category
#   ║  (double line)    separates categories

set -g status 2
set -g status-interval 1
set -g status-format[1] '#[default] #[fg=#{@hint-session},bold]SESSION #[reverse] ^b #[default,dim] + #[fg=#{@hint-session},reverse,nodim] d #[default] Detach #[dim]│ #[fg=#{@hint-session},reverse,nodim] s #[default] List #[dim]│ #[fg=#{@hint-session},reverse,nodim] a #[default] New #[dim]│ #[fg=#{@hint-session},reverse,nodim] $ #[default] Rename #[dim]│ #[fg=#{@hint-session},reverse,nodim] ( #[default] Prev #[dim]│ #[fg=#{@hint-session},reverse,nodim] ) #[default] Next #[dim]║ #[fg=#{@hint-window},bold,nodim]WINDOW #[reverse] ^b #[default,dim] + #[fg=#{@hint-window},reverse,nodim] c #[default] New #[dim]│ #[fg=#{@hint-window},reverse,nodim] n #[default] Next #[dim]│ #[fg=#{@hint-window},reverse,nodim] p #[default] Prev #[dim]│ #[fg=#{@hint-window},reverse,nodim] w #[default] List #[dim]│ #[fg=#{@hint-window},reverse,nodim] , #[default] Rename #[dim]║ #[fg=#{@hint-pane},bold,nodim]PANE #[reverse] ^b #[default,dim] + #[fg=#{@hint-pane},reverse,nodim] %% #[default] VSplit #[dim]│ #[fg=#{@hint-pane},reverse,nodim] " #[default] HSplit #[dim]│ #[fg=#{@hint-pane},reverse,nodim] z #[default] Zoom #[dim]│ #[fg=#{@hint-pane},reverse,nodim] x #[default] Kill #[dim]│ #[fg=#{@hint-pane},reverse,nodim] o #[default] Next #[dim]│ #[fg=#{@hint-pane},reverse,nodim] ←↓↑→ #[default] Navigate'

# =============================================================================
# Theme: Modus (auto-detected from ~/.local/state/theme)
# The watch-theme service also reloads on light/dark toggle at runtime.
# =============================================================================

run-shell '\
  theme=$(cat "$HOME/.local/state/theme" 2>/dev/null || echo dark); \
  if [ "$theme" = "light" ]; then \
    tmux source-file "$HOME/.config/tmux/themes/modus_operandi_tinted.tmux"; \
  else \
    tmux source-file "$HOME/.config/tmux/themes/modus_vivendi_tinted.tmux"; \
  fi'
