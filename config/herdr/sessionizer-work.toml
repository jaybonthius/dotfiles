[projects]
roots = [
  "~/repos",
  "~/code",
  "~/Code",
  "~/docker",
  "~/Code/workbench-*",
  "~/*-workbench/repos/*",
  "~",
]
git_only = true
depth = 1

[ui]
placement = "overlay"

[layout]
focus = "editor"

[tabs.editor]
label = "editor"

[[tabs.editor.panes]]
id = "editor"
title = "editor"
command = "emacs -nw"

[tabs.claude]
label = "claude"

[[tabs.claude.panes]]
id = "claude"
title = "claude"
command = "claude"

[tabs.terminal]
label = "terminal"

[[tabs.terminal.panes]]
id = "terminal"
title = "terminal"
command = ""
