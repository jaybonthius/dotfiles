onboarding = false
[terminal]
new_cwd = "follow"

[worktrees]
directory = "~/Code/worktrees"

[keys]
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
switch_workspace = "prefix+shift+1..9"
previous_agent = "prefix+comma"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+backtick"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[experimental]
kitty_graphics = true
